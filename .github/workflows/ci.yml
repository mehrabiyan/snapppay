name: Gateway verification
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.1', '8.2', '8.3']
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: test-only-root
          MYSQL_DATABASE: snapppay_test
          MYSQL_USER: snapppay_test
          MYSQL_PASSWORD: test-only-password
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -ptest-only-root"
          --health-interval=10s --health-timeout=5s --health-retries=10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: shivammathur/setup-php@b604ade2a87db23f8871b7182e69ec5e75effb45 # v2
        with:
          php-version: '${{ matrix.php }}'
          extensions: curl, bcmath, mbstring, pdo_mysql, pdo_sqlite, sodium, pcntl
          coverage: none
          tools: composer:v2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: composer install --no-interaction --prefer-dist
      - run: composer validate --strict && composer audit --no-interaction
      - run: python3 tools/lint.py
      - run: composer analyse
      - run: composer test
      - run: python3 tests/integration/transport.py
      - run: php tests/integration/mysql.php
        env:
          SNAPPPAY_TEST_DSN: mysql:host=127.0.0.1;port=3306;dbname=snapppay_test
      - run: python3 tests/e2e/run.py
      - run: python3 tools/package.py
